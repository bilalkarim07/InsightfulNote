name: Evening Reporting

on:
  schedule:
    # 19:00, 20:00, 21:00, 22:00, 23:00 US/Eastern (23:00 - 03:00 UTC)
    - cron: "0 23,0,1,2,3 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Set to true to publish for real"
        type: boolean
        default: false

concurrency:
  group: newsroom-evening
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run evening reporting
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          NEWSROOM_LIVE: ${{ github.event.inputs.live == 'true' && 'true' || vars.NEWSROOM_LIVE }}
          NEWSROOM_MAX_PER_DAY: ${{ vars.NEWSROOM_MAX_PER_DAY || '5' }}
          NEWSROOM_PUBLISH_TIMEZONE: ${{ vars.NEWSROOM_PUBLISH_TIMEZONE || 'America/New_York' }}
        run: python scripts/agents/run_evening_reporting.py

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evening-${{ github.run_id }}
          path: |
            data/runs/
            data/pipeline_log.jsonl
          if-no-files-found: ignore
          retention-days: 7