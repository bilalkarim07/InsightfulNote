name: NewsRoom Hourly

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run next topic
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NEWSROOM_LIVE: ${{ vars.NEWSROOM_LIVE }}
        run: python scripts/agents/run_next_topic.py ollama gpt-oss:120b

      - name: Upload run snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ github.run_id }}
          path: |
            data/runs/
            data/pipeline_log.jsonl
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated queue
        if: always()
        run: |
          git config user.name "newsroom-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/topic_queue.json data/quota.json
          git diff --staged --quiet || git commit -m "chore: consume topic"
          git push || true